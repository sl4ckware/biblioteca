<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">


    <title>
        Login - Sistema Integral de Biblioteca
    </title>


    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <!-- Estilos propios -->
    <link href="css/login.css"
          rel="stylesheet">

</head>


<body>


<div class="container-fluid login-container">


    <div class="row justify-content-center align-items-center vh-100">


        <div class="col-md-4">


            <div class="card shadow login-card">


                <div class="card-body p-5">


                    <!-- LOGO / TITULO -->

                    <div class="text-center mb-4">


                        <div class="icono-biblioteca">

                            📚

                        </div>


                        <h3 class="mt-3">

                            Sistema Integral de Biblioteca

                        </h3>


                        <p class="text-muted">

                            Acceso administrativo

                        </p>


                    </div>



                    <!-- MENSAJE ERROR -->

                    <div id="mensajeError"
                         class="alert alert-danger d-none">

                    </div>



                    <!-- FORMULARIO -->

                    <form id="formLogin">


                        <!-- CORREO -->

                        <div class="mb-3">


                            <label for="correo"
                                   class="form-label">

                                Correo electrónico

                            </label>


                            <input type="email"
                                   class="form-control"
                                   id="correo"
                                   name="correo"
                                   placeholder="usuario@biblioteca.local"
                                   required>


                        </div>




                        <!-- PASSWORD -->

                        <div class="mb-3">


                            <label for="password"
                                   class="form-label">

                                Contraseña

                            </label>


                            <input type="password"
                                   class="form-control"
                                   id="password"
                                   name="password"
                                   placeholder="Ingrese su contraseña"
                                   required>


                        </div>




                        <!-- BOTON -->

                        <div class="d-grid mt-4">


                            <button type="submit"
                                    class="btn btn-primary btn-lg">


                                Ingresar


                            </button>


                        </div>


                    </form>


                </div>


            </div>


        </div>


    </div>


</div>




<script src="js/login.js"></script>


</body>


</html>
